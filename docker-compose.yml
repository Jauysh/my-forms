version: '3.8'

services:
  # Next.js App Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-forms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=http://db:5432
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy-key
    depends_on:
      - db

  # Local PostgreSQL for Offline Classroom Mode
  db:
    image: postgres:16-alpine
    container_name: my-forms-local-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: myformspassword
      POSTGRES_DB: myforms
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
